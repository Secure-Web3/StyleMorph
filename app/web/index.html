<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS & PWA meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StyleMorph">
  <meta name="theme-color" content="#0D0D0F">
  <link rel="apple-touch-icon" href="icons/sm-icon-192.png?v=3">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="sm-favicon.png?v=3"/>

  <title>stylemorph</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background-color: #0D0D0F;
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    #sm-pre-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0D0D0F;
      transition: opacity 260ms ease-out;
      pointer-events: none;
    }

    #sm-pre-splash.sm-hidden {
      opacity: 0;
    }

    .sm-splash-logo-wrap {
      position: relative;
      width: 168px;
      height: 168px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sm-splash-logo-wrap img {
      display: block;
      width: 168px;
      height: 168px;
      object-fit: contain;
      opacity: 0.92;
      user-select: none;
      -webkit-user-drag: none;
    }

    .sm-splash-sheen {
      position: absolute;
      inset: 0;
      pointer-events: none;
      -webkit-mask-image: url('icons/sm_splash_transparent.png?v=3');
      mask-image: url('icons/sm_splash_transparent.png?v=3');
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
      background-image: linear-gradient(
        125deg,
        transparent 32%,
        rgba(212, 175, 55, 0.45) 43%,
        rgba(255, 244, 200, 0.95) 50%,
        rgba(212, 175, 55, 0.45) 57%,
        transparent 68%
      );
      background-size: 260% 260%;
      background-position: 0% 0%;
      animation: smGoldSheen 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes smGoldSheen {
      0% {
        background-position: 0% 0%;
      }
      72%, 100% {
        background-position: 100% 100%;
      }
    }
  </style>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <script>
    window.turnstileCallbacks = {};
    window.isTurnstileLoaded = function() {
      return typeof window.turnstile !== 'undefined';
    };
    window.setTurnstileHandler = function(callbackId, onVerified, onExpired, onError, onLoaded) {
      window.turnstileCallbacks[callbackId] = {
        onVerified: onVerified,
        onExpired: onExpired,
        onError: onError,
        onLoaded: onLoaded
      };
    };
    window.removeTurnstileHandler = function(callbackId) {
      delete window.turnstileCallbacks[callbackId];
    };
    window.renderTurnstileExplicit = function(containerId, siteKey, callbackId, theme) {
      if (!window.turnstile) return null;
      try {
        var el = document.getElementById(containerId);
        if (!el) return null;
        var widgetId = window.turnstile.render(el, {
          sitekey: siteKey,
          theme: theme || 'auto',
          'before-interactive-callback': function() {
            var cb = window.turnstileCallbacks[callbackId];
            if (cb && cb.onLoaded) cb.onLoaded();
          },
          callback: function(token) {
            var cb = window.turnstileCallbacks[callbackId];
            if (cb && cb.onLoaded) cb.onLoaded();
            if (cb && cb.onVerified) cb.onVerified(token);
          },
          'expired-callback': function() {
            var cb = window.turnstileCallbacks[callbackId];
            if (cb && cb.onExpired) cb.onExpired();
          },
          'error-callback': function(err) {
            var cb = window.turnstileCallbacks[callbackId];
            if (cb && cb.onLoaded) cb.onLoaded();
            if (cb && cb.onError) cb.onError(err);
          }
        });
        if (widgetId) {
          setTimeout(function() {
            var cb = window.turnstileCallbacks[callbackId];
            if (cb && cb.onLoaded) cb.onLoaded();
          }, 350);
        }
        return widgetId;
      } catch (e) {
        console.error('Turnstile render error:', e);
        return null;
      }
    };
    window.resetTurnstileExplicit = function(widgetId) {
      if (window.turnstile) {
        try {
          if (widgetId) {
            window.turnstile.reset(widgetId);
          } else {
            window.turnstile.reset();
          }
        } catch (_) {}
      }
    };
  </script>
</head>
<body>
  <div id="sm-pre-splash" aria-hidden="true">
    <div class="sm-splash-logo-wrap">
      <img src="icons/sm_splash_transparent.png?v=3" alt="StyleMorph" width="168" height="168" />
      <div class="sm-splash-sheen"></div>
    </div>
  </div>
  <script>
    (function () {
      function hidePreSplash() {
        var el = document.getElementById('sm-pre-splash');
        if (!el) return;
        el.classList.add('sm-hidden');
        setTimeout(function () {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 300);
      }
      window.addEventListener('flutter-first-frame', hidePreSplash, { once: true });
      setTimeout(hidePreSplash, 12000);
    })();
  </script>
  <!--
    Unregister ONLY legacy Flutter service workers (anything other than /pwa_sw.js),
    purge legacy caches only if a legacy service worker was found, and register our
    lightweight zero-cache /pwa_sw.js for standalone Chrome PWA / WebAPK installability.
  -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;

      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        var legacyRegs = registrations.filter(function (reg) {
          var scriptUrl =
            (reg.active && reg.active.scriptURL) ||
            (reg.waiting && reg.waiting.scriptURL) ||
            (reg.installing && reg.installing.scriptURL) ||
            '';
          return !scriptUrl.endsWith('/pwa_sw.js');
        });

        if (legacyRegs.length === 0) return;

        Promise.all(
          legacyRegs.map(function (reg) {
            return reg.unregister();
          })
        ).then(function () {
          if ('caches' in window) {
            caches.keys().then(function (cacheNames) {
              cacheNames.forEach(function (cacheName) {
                caches.delete(cacheName);
              });
            });
          }
        });
      });

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/pwa_sw.js', {
          scope: '/',
          updateViaCache: 'none'
        }).catch(function (err) {
          console.warn('PWA Service Worker registration failed:', err);
        });
      });
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
