<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="stylemorph">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>stylemorph</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <script>
    window.turnstileCallbacks = {};
    window.isTurnstileLoaded = function() {
      return typeof window.turnstile !== 'undefined';
    };
    window.setTurnstileHandler = function(callbackId, onVerified, onExpired, onError) {
      window.turnstileCallbacks[callbackId] = {
        onVerified: onVerified,
        onExpired: onExpired,
        onError: onError
      };
    };
    window.removeTurnstileHandler = function(callbackId) {
      delete window.turnstileCallbacks[callbackId];
    };
    window.renderTurnstileExplicit = function(containerId, siteKey, callbackId, theme) {
      if (!window.turnstile) return null;
      try {
        var el = document.getElementById(containerId);
        if (!el) return null;
        return window.turnstile.render(el, {
          sitekey: siteKey,
          theme: theme || 'auto',
          callback: function(token) {
            var cb = window.turnstileCallbacks[callbackId];
            if (cb && cb.onVerified) cb.onVerified(token);
          },
          'expired-callback': function() {
            var cb = window.turnstileCallbacks[callbackId];
            if (cb && cb.onExpired) cb.onExpired();
          },
          'error-callback': function(err) {
            var cb = window.turnstileCallbacks[callbackId];
            if (cb && cb.onError) cb.onError(err);
          }
        });
      } catch (e) {
        console.error('Turnstile render error:', e);
        return null;
      }
    };
    window.resetTurnstileExplicit = function(widgetId) {
      if (window.turnstile && widgetId) {
        try {
          window.turnstile.reset(widgetId);
        } catch (_) {}
      }
    };
  </script>
</head>
<body>
  <!--
    Unregister any active Flutter service workers and purge stale PWA caches
    before loading the app. This prevents users from being stuck on an outdated
    build after a new deployment without needing Incognito or manual cache clear.
  -->
  <script>
    (function () {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (reg) {
            reg.unregister();
          });
        });
      }
      if ('caches' in window) {
        caches.keys().then(function (cacheNames) {
          cacheNames.forEach(function (cacheName) {
            caches.delete(cacheName);
          });
        });
      }
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
