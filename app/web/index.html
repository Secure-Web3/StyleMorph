<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="stylemorph">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>stylemorph</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background-color: #0D0D0F;
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    #sm-pre-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0D0D0F;
      transition: opacity 260ms ease-out;
      pointer-events: none;
    }

    #sm-pre-splash.sm-hidden {
      opacity: 0;
    }

    .sm-splash-logo-wrap {
      position: relative;
      width: 180px;
      height: 180px;
      overflow: hidden;
      -webkit-mask-image: radial-gradient(circle, #000 0%, #000 68%, transparent 98%);
      mask-image: radial-gradient(circle, #000 0%, #000 68%, transparent 98%);
    }

    .sm-splash-logo-wrap img {
      display: block;
      width: 180px;
      height: 180px;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .sm-splash-logo-wrap::after {
      content: "";
      position: absolute;
      inset: -40%;
      background: linear-gradient(
        135deg,
        rgba(0, 0, 0, 0) 32%,
        rgba(184, 134, 11, 0.25) 42%,
        rgba(255, 217, 125, 0.55) 48%,
        rgba(255, 246, 214, 0.70) 50%,
        rgba(255, 217, 125, 0.55) 52%,
        rgba(184, 134, 11, 0.25) 58%,
        rgba(0, 0, 0, 0) 68%
      );
      mix-blend-mode: color-dodge;
      transform: translate3d(-65%, -65%, 0);
      animation: smGoldSheen 2.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      pointer-events: none;
    }

    @keyframes smGoldSheen {
      0% {
        transform: translate3d(-65%, -65%, 0);
      }
      72%, 100% {
        transform: translate3d(65%, 65%, 0);
      }
    }
  </style>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <script>
    window.turnstileCallbacks = {};
    window.isTurnstileLoaded = function() {
      return typeof window.turnstile !== 'undefined';
    };
    window.setTurnstileHandler = function(callbackId, onVerified, onExpired, onError, onLoaded) {
      window.turnstileCallbacks[callbackId] = {
        onVerified: onVerified,
        onExpired: onExpired,
        onError: onError,
        onLoaded: onLoaded
      };
    };
    window.removeTurnstileHandler = function(callbackId) {
      delete window.turnstileCallbacks[callbackId];
    };
    window.renderTurnstileExplicit = function(containerId, siteKey, callbackId, theme) {
      if (!window.turnstile) return null;
      try {
        var el = document.getElementById(containerId);
        if (!el) return null;
        var widgetId = window.turnstile.render(el, {
          sitekey: siteKey,
          theme: theme || 'auto',
          'before-interactive-callback': function() {
            var cb = window.turnstileCallbacks[callbackId];
            if (cb && cb.onLoaded) cb.onLoaded();
          },
          callback: function(token) {
            var cb = window.turnstileCallbacks[callbackId];
            if (cb && cb.onLoaded) cb.onLoaded();
            if (cb && cb.onVerified) cb.onVerified(token);
          },
          'expired-callback': function() {
            var cb = window.turnstileCallbacks[callbackId];
            if (cb && cb.onExpired) cb.onExpired();
          },
          'error-callback': function(err) {
            var cb = window.turnstileCallbacks[callbackId];
            if (cb && cb.onLoaded) cb.onLoaded();
            if (cb && cb.onError) cb.onError(err);
          }
        });
        if (widgetId) {
          setTimeout(function() {
            var cb = window.turnstileCallbacks[callbackId];
            if (cb && cb.onLoaded) cb.onLoaded();
          }, 350);
        }
        return widgetId;
      } catch (e) {
        console.error('Turnstile render error:', e);
        return null;
      }
    };
    window.resetTurnstileExplicit = function(widgetId) {
      if (window.turnstile) {
        try {
          if (widgetId) {
            window.turnstile.reset(widgetId);
          } else {
            window.turnstile.reset();
          }
        } catch (_) {}
      }
    };
  </script>
</head>
<body>
  <div id="sm-pre-splash" aria-hidden="true">
    <div class="sm-splash-logo-wrap">
      <img src="icons/splash_logo.png" alt="StyleMorph" width="180" height="180" />
    </div>
  </div>
  <script>
    (function () {
      function hidePreSplash() {
        var el = document.getElementById('sm-pre-splash');
        if (!el) return;
        el.classList.add('sm-hidden');
        setTimeout(function () {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 300);
      }
      window.addEventListener('flutter-first-frame', hidePreSplash, { once: true });
      setTimeout(hidePreSplash, 12000);
    })();
  </script>
  <!--
    Unregister any active Flutter service workers and purge stale PWA caches
    before loading the app. This prevents users from being stuck on an outdated
    build after a new deployment without needing Incognito or manual cache clear.
  -->
  <script>
    (function () {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (reg) {
            reg.unregister();
          });
        });
      }
      if ('caches' in window) {
        caches.keys().then(function (cacheNames) {
          cacheNames.forEach(function (cacheName) {
            caches.delete(cacheName);
          });
        });
      }
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
