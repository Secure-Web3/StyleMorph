name: stylemorph
description: "StyleMorph - AI Fashion, Beauty & Wellness Flutter App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  font_awesome_flutter: ^11.0.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  shadcn_ui: ^0.57.4
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  google_sign_in: 6.2.2
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.8
  web: ^1.1.1
  local_auth: ^3.0.2
  shared_preferences: ^2.5.6
  firebase_storage: ^14.1.0
  image_picker: ^1.2.4
  country_state_city: ^0.1.6
  firebase_app_check: ^0.5.2
  qr_flutter: ^4.1.0
  firebase_messaging: ^17.1.0
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.3
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/avatars/
    - assets/images/brand/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
    - family: Brygada1918
      fonts:
        - asset: assets/fonts/Brygada1918-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Brygada1918-Bold.ttf
          weight: 700
