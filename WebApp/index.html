<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="white">
<head>
<meta charset="UTF-8">

<title>StyleMorph</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={darkMode:'class',theme:{extend:{colors:{
bg:'var(--bg)',sf:'var(--sf)',bd:'var(--bd)',tx:'var(--tx)',mu:'var(--mu)',pr:'var(--pr)',prt:'var(--prt)',
google:{blue:'var(--pr)',hoverBlue:'var(--pr)',bgLight:'var(--bg)',surfaceLight:'var(--sf)',bgDark:'var(--bg)',surfaceDark:'var(--sf)',borderLight:'var(--bd)',borderDark:'var(--bd)',textLight:'var(--tx)',textDark:'var(--tx)'}}}}}
</script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
@import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
:root,[data-theme=white]{--bg:#fff;--sf:#fff;--bd:#e5e5e5;--tx:#171717;--mu:#737373;--pr:#171717;--prt:#fff;--ok:#2e6b47;--okb:#e6f3ea;--wn:#8a6a12;--wnb:#fbf3dc;--in:#2f5d9b;--inb:#e8f0fa;--or:#9a5418;--orb:#fbebdd}
[data-theme=beige]{--bg:#faf7f2;--sf:#fffdf9;--bd:#e7dfd3;--tx:#2b2118;--mu:#8a7b6b;--pr:#5c4033;--prt:#fffdf9}
[data-theme=slate]{--bg:#f4f5f6;--sf:#fff;--bd:#dde0e3;--tx:#26292d;--mu:#6b7178;--pr:#2f3438;--prt:#fff}
.dark[data-theme=white]{--bg:#111;--sf:#1a1a1a;--bd:#2c2c2c;--tx:#f2f2f2;--mu:#9a9a9a;--pr:#f2f2f2;--prt:#111}
.dark[data-theme=beige]{--bg:#1c1713;--sf:#251f19;--bd:#3a3128;--tx:#f3ebe0;--mu:#a8998a;--pr:#d9b99b;--prt:#1c1713}
.dark[data-theme=slate]{--bg:#17191b;--sf:#202325;--bd:#33373b;--tx:#e8eaec;--mu:#9aa0a6;--pr:#c9ced3;--prt:#17191b}
body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--tx);-webkit-tap-highlight-color:transparent}
.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}
/* نگاشت یکدست رنگ‌های قدیمی به توکن‌های تم */
.bg-gray-50,.bg-gray-100,.dark .dark\:bg-gray-800{background:var(--bg)!important}
.text-gray-400,.text-gray-500,.text-gray-300{color:var(--mu)!important}
.border-gray-200,.border-gray-300,.dark .dark\:border-gray-700{border-color:var(--bd)!important}
.text-emerald-500{color:var(--ok)}.text-blue-500{color:var(--in)}.text-amber-500,.text-amber-400{color:var(--wn)}.text-red-500{color:var(--or)}
.bg-emerald-500{background:var(--ok)}.bg-amber-500{background:var(--wn)}
[class*="bg-gradient"]{background:var(--sf)!important;color:var(--tx)!important;border:1px solid var(--bd)}
[class*="bg-gradient"] *{color:inherit!important}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px}
.btn{background:var(--pr);color:var(--prt);border-radius:10px;font-weight:700}
.chip{border:1px solid var(--bd);background:var(--sf);border-radius:999px;padding:4px 12px;font-size:12px;white-space:nowrap}
.chip.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
.dot{width:14px;height:14px;border-radius:999px;border:2px solid var(--bd)}
input,select{color:var(--tx)}input::placeholder{color:var(--mu)}
input:focus,select:focus{outline:none;border-color:var(--pr)!important}
button:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
[class*="text-[8px]"],[class*="text-[9px]"]{font-size:11px!important}[class*="text-[10px]"]{font-size:12px!important}
#main-header:not([data-mode=profile]) .pf-only{display:none}
#main-header[data-mode=profile] .av{width:3rem;height:3rem;border-radius:12px}
.pf-h{height:calc(100dvh - var(--hh,4rem) - 5.5rem)}
#support-box{overflow-y:auto}
html.lock,html.lock body{overflow:hidden;height:100dvh;overscroll-behavior:none}
#p-identity,#tab-profile .overflow-y-auto{overscroll-behavior:contain}
.pf-wrap{--sbc:color-mix(in srgb,var(--tx) 5%,var(--sf))}
.pf-side{background:var(--sbc)}
.pf-tab{position:relative;border-start-start-radius:12px;border-end-start-radius:12px;transition:background .2s,color .2s}
.pf-tab.pf-on{background:var(--sf);color:var(--tx)!important;font-weight:700;z-index:2}
.pf-tab.pf-on::before,.pf-tab.pf-on::after{content:'';position:absolute;inset-inline-end:0;width:12px;height:12px;pointer-events:none}
.pf-tab.pf-on::before{top:-12px}.pf-tab.pf-on::after{bottom:-12px}
html[dir=rtl] .pf-tab.pf-on::before{background:radial-gradient(circle at 100% 0,var(--sbc) 12px,var(--sf) 12.5px)}
html[dir=rtl] .pf-tab.pf-on::after{background:radial-gradient(circle at 100% 100%,var(--sbc) 12px,var(--sf) 12.5px)}
html[dir=ltr] .pf-tab.pf-on::before{background:radial-gradient(circle at 0 0,var(--sbc) 12px,var(--sf) 12.5px)}
html[dir=ltr] .pf-tab.pf-on::after{background:radial-gradient(circle at 0 100%,var(--sbc) 12px,var(--sf) 12.5px)}
#drawer{visibility:hidden;transition:visibility 0s .28s}#drawer.open{visibility:visible;transition-delay:0s}
.dr-ov{background:rgba(0,0,0,.4);opacity:0;transition:opacity .28s}#drawer.open .dr-ov{opacity:1}
.dr-panel{transform:translateX(-100%);transition:transform .28s cubic-bezier(.25,1,.5,1)}
html[dir=rtl] .dr-panel{transform:translateX(100%)}#drawer.open .dr-panel{transform:none!important}
#drawer-menu button:not(:disabled):hover,#drawer-menu button:not(:disabled):active{background:var(--bg)}
.th{width:22px;height:22px;border-radius:999px;border:1px solid var(--bd)}
html[data-theme=white] .th-white,html[data-theme=beige] .th-beige,html[data-theme=slate] .th-slate{box-shadow:0 0 0 2px var(--sf),0 0 0 3.5px var(--pr)}
#main-header[data-mode=profile] .ring{background:none!important;padding:0}#main-header[data-mode=profile] .av{border:1px solid var(--bd)}
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:50}.menu-overlay.on{opacity:1;pointer-events:auto}.menu{position:fixed;top:0;bottom:0;inset-inline-start:-100%;width:280px;border-inline-end:1px solid var(--bd);transition:inset-inline-start .3s ease;overflow-y:auto;z-index:51}.menu.on{inset-inline-start:0}.menu-logo{text-align:center;padding:2rem 1rem 1.5rem;border-bottom:1px solid var(--bd)}.menu-logo i{font-size:2rem;color:var(--pr);margin-bottom:.5rem;display:block}.menu-logo b{font-size:.875rem;font-weight:700}.menu-item{display:flex;align-items:center;gap:1rem;padding:.75rem 1rem;color:var(--tx);font-size:.875rem;border:none;background:none;cursor:pointer;width:100%;transition:background .2s}.menu-item:hover{background:var(--bg)}.menu-item i{width:1.25rem;text-align:center}.menu-divider{height:1px;background:var(--bd);margin:1rem 0}.menu-close{position:absolute;top:1rem;inset-inline-end:1rem;background:none;border:none;cursor:pointer;color:var(--mu);font-size:1rem;padding:.5rem}#support-widget{transition:transform .25s cubic-bezier(.25,1,.5,1)}#support-widget.dragging{transition:none!important}
</style>
</head>

</header>

Object.assign(T.ar,{mHist:'سجل القياس',mSaved:'الإطلالات المحفوظة',mOrders:'الطلبات',mSupport:'الدعم والمساعدة',mOut:'تسجيل الخروج'});
Object.assign(T.tr,{mHist:'Deneme geçmişi',mSaved:'Kayıtlı kombinler',mOrders:'Siparişler',mSupport:'Yardım ve destek',mOut:'Çıkış yap'});Object.assign(T.en,{pcT:'Profile completion'});Object.assign(T.ar,{pcT:'اكتمال الملف'});Object.assign(T.tr,{pcT:'Profil tamamlama'});
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
let currentType='personal',lang='fa';
const THEMES=['white','beige','slate'];
function applyI18n(root=document){const t=T[lang];
 root.querySelectorAll('[data-i18n]').forEach(e=>{if(t[e.dataset.i18n]!==undefined)e.textContent=t[e.dataset.i18n]});
 root.querySelectorAll('[data-i18n-ph]').forEach(e=>e.placeholder=t[e.dataset.i18nPh]||'');
 root.querySelectorAll('[data-num]').forEach(e=>e.textContent=new Intl.NumberFormat(t.loc).format(e.dataset.num)+' '+t.cur);
 root.querySelectorAll('[data-coin]').forEach(e=>e.textContent=new Intl.NumberFormat(t.loc,{signDisplay:'always'}).format(e.dataset.coin)+' '+t.coin);
 root.querySelectorAll('[data-cnt]').forEach(e=>e.textContent=new Intl.NumberFormat(t.loc).format(e.dataset.cnt)+' '+t.rP);
 const a=document.getElementById('auth-title');if(a){const p=currentType==='personal';a.textContent=t[p?'pT':'bT'];document.getElementById('auth-subtitle').textContent=t[p?'pS':'bS']}}
function changeLanguage(l){lang=T[l]?l:'fa';const t=T[lang];document.documentElement.dir=t.dir;document.documentElement.lang=lang;
 document.querySelectorAll('.rtl-flip').forEach(e=>e.style.transform=t.dir==='rtl'?'':'scaleX(-1)');
 document.getElementById('lang-select').value=lang;ls('sm-lang',lang);applyI18n();updateProgress()}
function setTheme(n){document.documentElement.dataset.theme=n;ls('sm-theme',n)}
function cycleTheme(){const c=document.documentElement.dataset.theme;setTheme(THEMES[(THEMES.indexOf(c)+1)%3])}
function toggleDark(){const d=document.documentElement.classList.toggle('dark');ls('sm-dark',d?'1':'0')}
function setMode(v){if(v==='system'){ls('sm-dark',null);document.documentElement.classList.toggle('dark',matchMedia('(prefers-color-scheme: dark)').matches)}else{document.documentElement.classList.toggle('dark',v==='dark');ls('sm-dark',v==='dark'?'1':'0')}}
function toggleTheme(){toggleDark()}
function initDeviceSettings(){
 document.querySelectorAll('[data-logo]').forEach(e=>e.innerHTML=LOGO);
 setTheme(ls('sm-theme')||'white');
 const d=ls('sm-dark');if(d==='1'||(d===null&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
 const nl=(navigator.language||'fa').slice(0,2).toLowerCase();changeLanguage(ls('sm-lang')||(T[nl]?nl:'fa'));
 makeSupportWidgetSnapToEdges()}
function goToAuth(type){currentType=type;page('page-welcome',0);page('page-auth',1);
 document.getElementById('back-btn-container').classList.remove('opacity-0','pointer-events-none');
 document.getElementById('business-extra-field').classList.toggle('hidden',type==='personal');
 document.getElementById('social-login-box').classList.toggle('hidden',type!=='personal');applyI18n()}
function page(id,show){document.getElementById(id).classList.toggle('hidden',!show)}
function goBackToWelcome(){page('page-auth',0);page('page-welcome',1);document.getElementById('back-btn-container').classList.add('opacity-0','pointer-events-none')}
function loginSuccess(){page('landing-container',0);['main-header','app-nav','app-main-content','support-widget'].forEach(i=>page(i,1));switchTab('shop')}
const loadedTabs={};
async function loadTabContent(id){if(loadedTabs[id])return;const p=document.getElementById('tab-'+id);
 try{const r=await fetch(p.dataset.src+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const d=document.createElement('div');d.innerHTML=(await r.text()).trim();
  const s=d.querySelector('section');p.innerHTML=s?s.innerHTML:d.innerHTML;loadedTabs[id]=true;applyI18n(p);if(id==='profile'){switchProfileTab('p-identity');updateProgress()}}
 catch(e){p.innerHTML='<p class="text-center text-xs py-8" style="color:var(--or)">'+T[lang].err+'</p>'}}
async function switchTab(id){
 ['shop','wardrobe','stylist','wellness','atelier','profile'].forEach(t=>{const on=t===id;
  document.getElementById('tab-'+t).classList.toggle('hidden',!on);
  const b=document.getElementById('nav-'+t)||{style:{}};b.style.color=on?'var(--pr)':'';b.style.fontWeight=on?'700':'';
  b.style.borderBottom=on?'2px solid var(--pr)':'2px solid transparent'});
 document.getElementById('main-header').dataset.mode=id==='profile'?'profile':'';document.documentElement.classList.toggle('lock',id==='profile');closeMenu();scrollTo(0,0);
 document.getElementById('app-main-content').classList.toggle('overflow-hidden',id==='profile');
 await loadTabContent(id)}
async function switchProfileTab(id){await loadTabContent('profile');
 ['p-identity','p-gallery','p-ai','p-wallet','p-referral','p-settings'].forEach(t=>{const p=document.getElementById(t),b=document.getElementById('btn-'+t);if(!p||!b)return;const on=t===id;
  p.classList.toggle('hidden',!on);b.classList.toggle('pf-on',on)})}
function markAsEdited(el){const b=el.parentElement.querySelector('.badge-status');if(b){b.innerText='USER';b.className='badge-status font-bold';b.style.color='var(--ok)'}}
function toggleWidgetVisibility(s){page('support-widget',s)}
function toggleHeaderCoins(s){page('header-coins',s)}
function placeSupportBox(){return true}
function toggleMenu(){const m=document.getElementById('menu'),o=document.getElementById('menu-overlay');m.classList.toggle('on');o.classList.toggle('on')}
function closeMenu(){document.getElementById('menu').classList.remove('on');document.getElementById('menu-overlay').classList.remove('on')}
function logout(){if(confirm('Are you sure?')){ls('sm-lang',null);ls('sm-theme',null);ls('sm-dark',null);ls('sm-steps',null);location.reload()}}
function toggleSupportChat(){document.getElementById('support-box').classList.toggle('hidden');placeSupportBox()}
function makeSupportWidgetSnapToEdges(){
 const w=document.getElementById('support-widget');let drag=false,moved=false,sx,sy,cx=0,cy=0,px,py;
 const pt=e=>e.touches?e.touches[0]:e;
 w.addEventListener('touchstart',ds,{passive:true});w.addEventListener('mousedown',ds);
 addEventListener('touchmove',mv,{passive:false});addEventListener('mousemove',mv);
 addEventListener('touchend',de);addEventListener('mouseup',de);
 w.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
 function ds(e){if(!e.target.closest('#support-btn'))return;drag=true;moved=false;const p=pt(e);px=p.clientX;py=p.clientY;sx=p.clientX-cx;sy=p.clientY-cy;w.classList.add('dragging')}
 function mv(e){if(!drag)return;const p=pt(e);if(Math.abs(p.clientX-px)+Math.abs(p.clientY-py)>6)moved=true;if(!moved)return;e.cancelable&&e.preventDefault();cx=p.clientX-sx;cy=p.clientY-sy;w.style.transform=`translate3d(${cx}px,${cy}px,0)`;placeSupportBox()}
 function de(){if(!drag)return;drag=false;w.classList.remove('dragging');if(!moved)return;
  const r=w.getBoundingClientRect(),W=innerWidth,rtl=document.dir==='rtl',dx=(r.left+r.width/2<W/2)?-(r.left-12):(W-r.right-12);
  cx+=dx;if(r.top<60)cy+=60-r.top;else if(r.top>innerHeight-120)cy-=r.top-(innerHeight-120);
  w.style.transform=`translate3d(${cx}px,${cy}px,0)`;placeSupportBox()}}
function placeSupportBox(){const b=document.getElementById('support-box');if(b.classList.contains('hidden'))return;
 const w=document.getElementById('support-widget'),W=innerWidth,H=innerHeight,m=8,hh=(document.getElementById('main-header').offsetHeight||0)+m,nb=76;
 const bw=Math.min(288,W-2*m);b.style.width=bw+'px';b.style.maxHeight=(H-hh-nb)+'px';
 const r=w.getBoundingClientRect(),bh=b.offsetHeight;
 const L=Math.min(Math.max(r.right-bw,m),W-bw-m);
 let T=r.top-bh-8;if(T<hh)T=r.bottom+8;if(T+bh>H-nb)T=Math.max(hh,Math.min(r.top-bh-8,H-nb-bh));
 b.style.left=(L-r.left)+'px';b.style.top=(T-r.top)+'px';b.style.right='auto';b.style.bottom='auto'}
addEventListener('resize',placeSupportBox);
const LOGO='<svg viewBox="0 0 48 48" width="100%" height="100%"><rect width="48" height="48" rx="12" fill="var(--pr)"/><g fill="none" stroke="var(--prt)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 15.5V14a3.2 3.2 0 1 1 3.2 3.2"/><path d="M24 17.5 10.5 28.5c-1.6 1.3-.7 3.9 1.4 3.9h24.2c2.1 0 3-2.6 1.4-3.9z"/><path stroke-width="2" d="M15 37c3-2.4 5.4 2.4 9 0s6-2.4 9 0"/></g></svg>';
function openDrawer(){renderDrawer();document.getElementById('drawer').classList.add('open')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open')}
function openProfile(t){closeDrawer();switchTab('profile').then(()=>switchProfileTab(t))}
function openSupport(){closeDrawer();page('support-widget',1);if(document.getElementById('support-box').classList.contains('hidden'))toggleSupportChat()}
function signOut(){closeDrawer();['main-header','app-nav','app-main-content','support-widget'].forEach(i=>page(i,0));document.documentElement.classList.remove('lock');page('landing-container',1);goBackToWelcome()}
const MENU=[['fa-user','nProf',"openProfile('p-identity')",1],['fa-wallet','tWal',"openProfile('p-wallet')"],['fa-gift','tRef',"openProfile('p-referral')"],0,['fa-clock-rotate-left','mHist'],['fa-bookmark','mSaved'],['fa-bag-shopping','mOrders'],0,['fa-sliders','tSet',"openProfile('p-settings')"],['fa-headset','mSupport','openSupport()']];
function renderDrawer(){const t=T[lang],p=new Intl.NumberFormat(t.loc,{style:'percent'}).format(getDone().filter(Boolean).length/5);
 document.getElementById('drawer-menu').innerHTML=MENU.map(m=>!m?'<div class="my-2 border-t border-bd"></div>':`<button ${m[2]?`onclick="${m[2]}"`:'disabled'} class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-start${m[2]?'':' opacity-60'}"><i class="fa-solid ${m[0]} w-5 text-center text-mu"></i><span class="flex-1">${t[m[1]]}</span>${m[3]?`<b class="text-xs text-mu">${p}</b>`:''}${m[2]?'':`<span class="chip text-[11px]">${t.soon}</span>`}</button>`).join('');
 document.getElementById('drawer-out').textContent=t.mOut;document.getElementById('drawer-lang').value=lang}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
const STEPS=['identity','gallery','ai','wallet','referral'],SL=['tIdent','tGal','tAi','tWal','tRef'];
let steps={};try{steps=JSON.parse(ls('sm-steps')||'{}')}catch(e){}
function filled(id){const p=document.getElementById(id);if(!p)return true;const i=[...p.querySelectorAll('input[type=text],input[type=email]')];return i.length>0&&i.every(x=>x.value.trim())}
function getDone(){return STEPS.map(s=>s==='identity'?filled('p-identity'):s==='ai'?filled('p-ai'):!!steps[s])}
function markStep(s){steps[s]=true;ls('sm-steps',JSON.stringify(steps));updateProgress()}
function goNextStep(){const i=getDone().indexOf(false);if(i>-1)switchProfileTab('p-'+STEPS[i])}
function updateProgress(){const t=T[lang],n=getDone().filter(Boolean).length,pct=document.getElementById('pf-pct');if(!pct)return;
 pct.textContent=new Intl.NumberFormat(t.loc,{style:'percent'}).format(n/5);document.getElementById('pf-fill').style.width=n*20+'%';document.documentElement.style.setProperty('--pp',n*20+'%');renderDrawer()}
document.addEventListener('input',e=>{if(e.target.closest('#p-identity,#p-ai'))updateProgress()});
addEventListener('DOMContentLoaded',()=>{const h=document.getElementById('main-header');new ResizeObserver(()=>document.documentElement.style.setProperty('--hh',h.offsetHeight+'px')).observe(h)});
addEventListener('DOMContentLoaded',initDeviceSettings);
</script>
