name: Live Design Preview

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'admin/**'
      - '.github/workflows/live_preview.yml'
      - 'firebase.json'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Web App
        run: |
          cd app
          flutter pub get
          APP_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d'+' -f1)
          RELEASE_DATE=$(date -u +%Y-%m-%d)
          flutter build web --release --base-href "/" --pwa-strategy=none \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=BUILD_NUMBER="${{ github.run_number }}" \
            --dart-define=APP_ENV=preview \
            --dart-define=RELEASE_DATE="$RELEASE_DATE" \
            --dart-define=GIT_SHA="${{ github.sha }}"

      - name: Build Flutter Web Admin Panel
        run: |
          cd admin
          flutter pub get
          flutter build web --release --base-href "/admin/"

      - name: Assemble Site Directory
        run: |
          mkdir -p _site/admin
          cp -r app/build/web/* _site/
          cp -r admin/build/web/* _site/admin/

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STYLEMORPH_PREVIEW }}'
          channelId: live
          projectId: stylemorph-preview
