name: Live Design Preview

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'admin/**'
      - '.github/workflows/live_preview.yml'
      - 'firebase.json'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Inject Secure Firebase Options
        env:
          FIREBASE_OPTIONS: '${{ secrets.FIREBASE_OPTIONS_DART_CONTENT }}'
        run: |
          mkdir -p app/lib/core/services
          echo "$FIREBASE_OPTIONS" > app/lib/core/services/firebase_options.dart

      - name: Build Flutter Web App
        run: |
          cd app
          flutter pub get
          flutter build web --release --base-href "/"

      - name: Build Flutter Web Admin Panel
        run: |
          cd admin
          flutter pub get
          flutter build web --release --base-href "/admin/"

      - name: Assemble Site Directory
        run: |
          mkdir -p _site/admin
          cp -r app/build/web/* _site/
          cp -r admin/build/web/* _site/admin/

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STYLEMORPH_PREVIEW }}'
          channelId: live
          projectId: stylemorph-preview
