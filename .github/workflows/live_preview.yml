name: Live Design Preview

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'admin/**'
      - '.github/workflows/live_preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build Flutter Web App
        run: |
          cd app
          flutter pub get
          flutter build web --release --base-href "/StyleMorph/"

      - name: Build Flutter Web Admin Panel
        run: |
          cd admin
          flutter pub get
          flutter build web --release --base-href "/StyleMorph/admin/"

      - name: Prepare Site Directory
        run: |
          mkdir -p _site/admin
          cp -r app/build/web/* _site/
          cp -r admin/build/web/* _site/admin/
          touch _site/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
