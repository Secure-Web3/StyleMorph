name: Build Signed Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional Git tag (e.g. v1.0.0-android.5) to publish a GitHub Release with StyleMorph-arm64.apk"
        required: false
        default: ""
        type: string
      force_update:
        description: "Mark this release as a forced update in Firestore app_config/version"
        required: false
        default: false
        type: boolean

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Pre-install Android NDK (28.2.13676358)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      - name: Decode Android Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/android/app/stylemorph-key.jks

      - name: Generate Android key.properties
        run: |
          cat << 'EOF' > app/android/key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=stylemorph
          storeFile=stylemorph-key.jks
          EOF

      - name: Write google-services.json
        run: |
          cat << 'EOF' > app/android/app/google-services.json
          ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          EOF

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Resolve Build Metadata
        id: meta
        run: |
          RAW_TAG="${{ inputs.release_tag }}"
          if [ -n "$RAW_TAG" ]; then
            APP_VERSION="${RAW_TAG#v}"
            APP_VERSION="${APP_VERSION#V}"
          else
            APP_VERSION="$(grep -E '^version:' app/pubspec.yaml | head -n1 | sed -E 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/')"
          fi
          BUILD_NUMBER="${{ github.run_number }}"
          RELEASE_DATE="$(date -u +%Y-%m-%d)"
          APK_ARM64="StyleMorph-V${APP_VERSION}-B${BUILD_NUMBER}-arm64.apk"
          APK_ARM32="StyleMorph-V${APP_VERSION}-B${BUILD_NUMBER}-arm32.apk"
          APK_UNIVERSAL="StyleMorph-V${APP_VERSION}-B${BUILD_NUMBER}-universal.apk"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "RELEASE_DATE=${RELEASE_DATE}" >> "$GITHUB_ENV"
          echo "APP_ENV=preview" >> "$GITHUB_ENV"
          echo "GIT_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "apk_arm64=${APK_ARM64}" >> "$GITHUB_OUTPUT"
          echo "apk_arm32=${APK_ARM32}" >> "$GITHUB_OUTPUT"
          echo "apk_universal=${APK_UNIVERSAL}" >> "$GITHUB_OUTPUT"

      - name: Build Split Release APKs (arm64-v8a & armeabi-v7a)
        working-directory: app
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dkotlin.daemon.jvm.options=-Xmx2g"
        run: |
          flutter build apk --release \
            --no-pub \
            --split-per-abi \
            --split-debug-info=build/app/outputs/symbols \
            --obfuscate \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=BUILD_NUMBER="$BUILD_NUMBER" \
            --dart-define=RELEASE_DATE="$RELEASE_DATE" \
            --dart-define=APP_ENV=preview \
            --dart-define=GIT_SHA="${{ github.sha }}"

      - name: Build Universal Release APK
        working-directory: app
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dkotlin.daemon.jvm.options=-Xmx2g"
        run: |
          flutter build apk --release \
            --no-pub \
            --split-debug-info=build/app/outputs/symbols-universal \
            --obfuscate \
            --build-name="$APP_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=APP_VERSION="$APP_VERSION" \
            --dart-define=BUILD_NUMBER="$BUILD_NUMBER" \
            --dart-define=RELEASE_DATE="$RELEASE_DATE" \
            --dart-define=APP_ENV=preview \
            --dart-define=GIT_SHA="${{ github.sha }}"

      - name: Prepare APK Artifacts
        run: |
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "${{ steps.meta.outputs.apk_arm64 }}"
          cp app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "${{ steps.meta.outputs.apk_arm32 }}"
          cp app/build/app/outputs/flutter-apk/app-release.apk "${{ steps.meta.outputs.apk_universal }}"

      - name: Verify Signed APKs (apksigner & aapt2)
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "Android build-tools not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Using Android build-tools: $BUILD_TOOLS_DIR"
          for apk in "${{ steps.meta.outputs.apk_arm64 }}" "${{ steps.meta.outputs.apk_arm32 }}" "${{ steps.meta.outputs.apk_universal }}"; do
            "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$apk"
          done
          BADGING="$("$BUILD_TOOLS_DIR/aapt2" dump badging "${{ steps.meta.outputs.apk_arm64 }}")"
          printf '%s\n' "$BADGING" | head -n 20

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: StyleMorph-android-apks
          path: |
            ${{ steps.meta.outputs.apk_arm64 }}
            ${{ steps.meta.outputs.apk_arm32 }}
            ${{ steps.meta.outputs.apk_universal }}
          retention-days: 14

      - name: Generate Structured Release Notes
        if: ${{ inputs.release_tag != '' }}
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 "${{ inputs.release_tag }}^" 2>/dev/null || git tag --sort=-v:refname | grep -Fxv "${{ inputs.release_tag }}" | head -n 1 || true)"
          if [ -n "$PREV_TAG" ]; then
            COMMITS="$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"%s" || true)"
          else
            COMMITS="$(git log -n 20 --no-merges --pretty=format:"%s" || true)"
          fi

          FEATURES="$(printf '%s\n' "$COMMITS" | grep -E '^(feat|perf|style|refactor)(\([^)]*\))?:' || true)"
          FIXES="$(printf '%s\n' "$COMMITS" | grep -E '^(fix|security|ci|chore|test)(\([^)]*\))?:' || true)"
          OTHER="$(printf '%s\n' "$COMMITS" | grep -Ev '^(feat|perf|style|refactor|fix|security|ci|chore|test)(\([^)]*\))?:' || true)"

          {
            echo "## StyleMorph Android ${{ inputs.release_tag }}"
            echo ""
            echo "### ✨ What's New & Improvements"
            if [ -n "$FEATURES" ]; then
              printf '%s\n' "$FEATURES" | sed 's/^/- /'
            else
              echo "- General performance, UI, and stability refinements."
            fi
            echo ""
            echo "### 🐛 Bug Fixes & Security"
            if [ -n "$FIXES" ]; then
              printf '%s\n' "$FIXES" | sed 's/^/- /'
            else
              echo "- Routine maintenance and security hardening."
            fi
            if [ -n "$OTHER" ]; then
              echo ""
              echo "### 📝 Other Changes"
              printf '%s\n' "$OTHER" | sed 's/^/- /'
            fi
            echo ""
            echo "### 📦 APK Downloads"
            echo "- \`${{ steps.meta.outputs.apk_arm64 }}\` — Recommended for modern 64-bit Android devices (\`arm64-v8a\`, smallest size)."
            echo "- \`${{ steps.meta.outputs.apk_arm32 }}\` — For older 32-bit Android devices (\`armeabi-v7a\`)."
            echo "- \`${{ steps.meta.outputs.apk_universal }}\` — Universal APK compatible with all Android architectures (used by the in-app updater)."
          } > RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: StyleMorph Android ${{ inputs.release_tag }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            ${{ steps.meta.outputs.apk_arm64 }}
            ${{ steps.meta.outputs.apk_arm32 }}
            ${{ steps.meta.outputs.apk_universal }}

      - name: Update Firestore app_config/version & Send FCM Push
        if: ${{ inputs.release_tag != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_VERSION: ${{ env.APP_VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          ANDROID_URL: https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}/${{ steps.meta.outputs.apk_universal }}
          RELEASE_NOTES: StyleMorph Android ${{ inputs.release_tag }}
          FORCE_UPDATE: ${{ inputs.force_update }}
        run: node .github/scripts/publish_release_update.mjs
